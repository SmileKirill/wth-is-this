  }
  h1{

  .sub{color:var(--muted); font-size:0.8rem;}
  .search{
    width:100%; margin-top:10px; padding:10px 12px;
    background:var(--panel2); border:1px solid var(--border);
    color:var(--text); border-radius:6px; font-family:inherit; font-size:0.95rem;
  }
  main{max-width:780px; margin:0 auto; padding:10px 12px 60px;}

  .cat{
    border:1px solid var(--border); border-radius:8px;
    margin-top:10px; overflow:hidden; background:var(--panel);
  }
  .cat > .cathead{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; cursor:pointer; user-select:none;
  }
  .cat > .cathead:hover{ background:var(--panel2); }
  .cat h2{
    margin:0; font-size:0.9rem; color:var(--accent); text-transform:uppercase;
    letter-spacing:.8px;
  }
  .cat .count{
    color:var(--muted); font-size:0.75rem; margin-left:8px; font-weight:normal;
  }
  .chevron{
    color:var(--muted); font-size:0.8rem; transition:transform .2s; flex-shrink:0;
  }
  .cat.open .chevron{ transform:rotate(90deg); }
  .catbody{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    padding:0 10px;
  }
  .cat.open .catbody{ padding:0 10px 10px; }

  .subcat{ margin-top:8px; }
  .subcat > .subhead{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; cursor:pointer; background:var(--panel2);
    border:1px solid var(--border); border-radius:6px; user-select:none;
  }
  .subcat > .subhead h3{
    margin:0; font-size:0.82rem; color:var(--text); font-weight:normal;
  }
  .subcat .schevron{ color:var(--muted); font-size:0.75rem; transition:transform .2s; }
  .subcat.open .schevron{ transform:rotate(90deg); }
  .subbody{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .subcat.open .subbody{ padding-top:6px; }

  .quote{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--panel); border:1px solid var(--border);
    border-radius:6px; padding:9px 11px; margin-bottom:6px;
    cursor:pointer; transition:border-color .15s, transform .05s;
  }
  .quote:hover{ border-color:var(--accent); }
  .quote:active{ transform:scale(0.99); }
  .quote .text{
    flex:1; font-size:0.92rem; line-height:1.4; white-space:pre-wrap;
  }
  .quote .icon{
    flex-shrink:0; width:26px; height:26px; border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel2); border:1px solid var(--border);
    font-size:0.8rem; color:var(--muted);
  }
  .quote.copied .icon{ background:var(--ok); color:#04210f; border-color:var(--ok); }
  .quote.copied{ border-color:var(--ok); }

  .empty{ color:var(--muted); text-align:center; padding:40px 0; display:none; }

  footer{
    text-align:center; color:var(--muted); font-size:0.72rem;
    padding:20px 0 calc(20px + env(safe-area-inset-bottom,0px));
  }
  ::selection{ background:var(--accent); color:#000; }
  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(20px);
    background:var(--ok); color:#04210f; padding:8px 16px; border-radius:20px;
    font-size:0.85rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
